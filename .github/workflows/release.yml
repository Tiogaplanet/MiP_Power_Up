name: Arduino Library Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # e.g. v2.0.2

jobs:
  validate-and-build:
    name: Lint & Compile Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          compliance: specification
          library-manager: submit

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 and AVR Cores
        run: |
          # Add the ESP8266 board manager URL and update the index
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          
          # Install ESP8266 core
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          
          # Install AVR core for Pro Mini
          arduino-cli core install arduino:avr

      - name: Patch elf2bin.py Syntax Warnings (ESP8266 toolchain fix)
        run: |
          python3 - << 'EOF'
          import os
          path = os.path.expanduser('~/.arduino15/packages/esp8266/hardware/esp8266/3.1.2/tools/elf2bin.py')
          if os.path.exists(path):
              with open(path, 'r') as f:
                  text = f.read()
              # Safely replace the regex string without shell escape interference
              text = text.replace("re.split('\\s+', line)", "re.split(r'\\s+', line)")
              with open(path, 'w') as f:
                  f.write(text)
              print('Successfully patched elf2bin.py')
          else:
              print('Warning: elf2bin.py target file path not found')
          EOF

      - name: Install Local Library
        run: |
          mkdir -p $HOME/Arduino/libraries
          # Symlink the workspace into the Arduino libraries folder using the unified library name
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/MiP_Power_Up

      - name: Generate fake secrets.h for CI tests
        run: |
          # Create a dummy secrets.h file in every example directory so #include "secrets.h" compiles successfully
          for example in $HOME/Arduino/libraries/MiP_Power_Up/examples/*; do
            if [ -d "$example" ]; then
              echo '#define SECRET_SSID "CI_TEST_SSID"' > "$example/secrets.h"
              echo '#define SECRET_PASS "CI_TEST_PASS"' >> "$example/secrets.h"
            fi
          done

      - name: Compile all examples across architectures
        run: |
          for example in $HOME/Arduino/libraries/MiP_Power_Up/examples/*; do
            if [ -d "$example" ]; then
              EXAMPLE_NAME=$(basename "$example")
              echo "============================================================"
              echo "Compiling $EXAMPLE_NAME"
              echo "============================================================"
              
              # Always compile for D1 mini (ESP8266)
              echo "Target: ESP8266 (D1 mini)"
              arduino-cli compile --warnings all --fqbn esp8266:esp8266:d1_mini "$example"
              
              # Skip AVR compilation for examples that use networking or LittleFS
              if [[ "$EXAMPLE_NAME" == *"WiFi"* || "$EXAMPLE_NAME" == *"Debug"* ]]; then
                echo "Target: AVR (Pro Mini) -> SKIPPED (Requires ESP8266 network/filesystem features)"
              else
                echo "Target: AVR (Pro Mini)"
                arduino-cli compile --warnings all --fqbn arduino:avr:pro:cpu=16MHzatmega328 "$example"
              fi
              echo ""
            fi
          done

  publish-release:
    name: Create GitHub Release
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          python3 - << 'EOF'
          import os, re

          version = os.environ.get("VERSION", "")
          changelog_path = "CHANGELOG.md"
          notes = ""

          if os.path.exists(changelog_path):
              with open(changelog_path, "r", encoding="utf-8") as f:
                  content = f.read()

              # Pattern to match the version section, e.g. ## [2.0.2]
              pattern = r"##\s*\[" + re.escape(version) + r"\].*?\n(.*?)(?=\n##\s*\[|\Z)"
              match = re.search(pattern, content, re.DOTALL)

              if match:
                  notes = match.group(1).strip()

          if not notes:
              print("Warning: Version section not found in CHANGELOG.md. Falling back to default notes.")
              notes = f"Release v{version}"

          # Write notes to GITHUB_OUTPUT multi-line format
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write("notes<<EOF\n")
              f.write(notes + "\n")
              f.write("EOF\n")
          EOF
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}

      - name: Package Library ZIP
        run: |
          ZIP_NAME="MiP_Power_Up-${{ steps.vars.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" . -x "*.git*" "bump_version.py" ".github*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.vars.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            MiP_Power_Up-${{ steps.vars.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
